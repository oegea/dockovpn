# First run
# echo HOST_ADDR=$(curl -s https://icanhazip.com) > .env && docker-compose up -d && docker-compose exec -d dockovpn wget -O /opt/Dockovpn_data/client.ovpn localhost:8080

services:
  dockovpn:
    image: oriolegea/dockovpn
    cap_add:
        - NET_ADMIN
    # Uncomment to enable IPv6 leak protection (see BLOCK_IPV6 in README)
    # sysctls:
    #     - net.ipv6.conf.all.disable_ipv6=0
    ports:
        - 1194:1194/udp # Expose tcp if you defined HOST_TUN_PROTOCOL=tcp
    environment:
        HOST_ADDR: ${HOST_ADDR}
    volumes:
        - ./openvpn_conf:/opt/Dockovpn_data
    restart: always
