port 1194
proto %HOST_TUN_PROTOCOL%
dev tun
topology subnet
ca /etc/openvpn/ca.crt
cert /etc/openvpn/MyReq.crt
key /etc/openvpn/MyReq.key
dh /etc/openvpn/dh.pem
server 10.8.0.0 255.255.255.0
push "redirect-gateway def1 bypass-dhcp"
push "dhcp-option DNS 1.1.1.1"
push "dhcp-option DNS 1.0.0.1"
duplicate-cn
keepalive 10 120
# Data channel: AEAD ciphers only (no CBC fallback)
data-ciphers AES-256-GCM:CHACHA20-POLY1305
data-ciphers-fallback AES-256-GCM
auth SHA512
persist-tun
# Drop root privileges after initialization
user nobody
group nobody
status /var/lib/openvpn/openvpn-status.log
verb 1
tls-server
tls-version-min 1.2
# TLS 1.2 control channel: ECDHE + AEAD only (TLS 1.3 suites are negotiated separately)
tls-cipher TLS-ECDHE-RSA-WITH-AES-256-GCM-SHA384:TLS-ECDHE-RSA-WITH-CHACHA20-POLY1305-SHA256:TLS-ECDHE-RSA-WITH-AES-128-GCM-SHA256
tls-auth /etc/openvpn/ta.key 0
# Require client certificates to carry the TLS Web Client Authentication EKU
remote-cert-tls client
crl-verify /etc/openvpn/crl.pem
